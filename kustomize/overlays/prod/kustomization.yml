apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -prod
resources:
  - ../../base
  - cronjob_import.yml
secretGenerator:
  - name: caddy-env
    type: Opaque
    envs:
      - .env
generatorOptions:
  disableNameSuffixHash: true
labels:
  - includeSelectors: true
    pairs:
      variant: prod
patches:
  - path: webserver_patch.yml
images:
  - name: ghcr.io/dbca-wa/caddy
    newTag: 2.3.20
